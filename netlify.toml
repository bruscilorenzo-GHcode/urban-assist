[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Voice transcription (optional): the browser uploads raw audio to the function,
# which forwards it to Groq Whisper. Set GROQ_API_KEY in the site environment.
[[redirects]]
  from = "/api/groq/transcribe"
  to = "/.netlify/functions/transcribe"
  status = 200

# Stories + Dramaturgical Zones + cities: Netlify Blobs.
[[redirects]]
  from = "/api/story"
  to = "/.netlify/functions/story"
  status = 200

[[redirects]]
  from = "/api/zones"
  to = "/.netlify/functions/zones"
  status = 200

[[redirects]]
  from = "/api/cities"
  to = "/.netlify/functions/cities"
  status = 200

[[redirects]]
  from = "/api/media-upload"
  to = "/.netlify/functions/media-upload"
  status = 200

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200

# Single-page app: every path serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
